  <!-- GANTI LINK DISINI AJA -->
  <script>
    var VIDEO_LINK = "https://cdn2.videy.co/Ih2oZk331.mp4";
  </script>

  <style>
    :root {
      --primary-bg: #101014; --header-bg: #191a1f; --card-bg: #16171c;
      --border-color: #232329; --footer-bg: #18181e; --accent: #ffd900;
      --text-main: #fff; --text-footer: #ccc;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%; width: 100%; font-family: "Poppins", Arial, sans-serif;
      background: var(--primary-bg); color: var(--text-main);
      min-height: 100vh; display: flex; flex-direction: column;
    }
    header {
      background: var(--header-bg); text-align: center; padding: 18px 12px 14px 12px;
      font-size: 1.35rem; font-weight: 600; letter-spacing: 1px;
      box-shadow: 0 1.5px 6px rgba(0,0,0,0.15); border-bottom: 1px solid var(--border-color);
      color: var(--text-main); position: sticky; top: 0; z-index: 10; word-break: break-word;
    }
  .container {
      flex: 1; display: flex; flex-direction: column; justify-content: flex-start;
      align-items: center; padding: 18px 8px 10px 8px; width: 100%; max-width: 430px; margin: 0 auto;
    }
    video {
      width: 80%; object-fit: contain; border-radius: 12px; background: #18181e;
      box-shadow: 0 2px 18px rgba(0,0,0,0.11); margin-bottom: 18px; outline: none;
      border: 1px solid var(--border-color); transition: box-shadow 0.2s;
    }
  .banner-ad {
      background: var(--card-bg); border: 1px solid #292a2f; border-radius: 10px;
      padding: 11px 10px 8px 10px; width: 100%; text-align: center; font-size: 1rem;
      margin-top: 1px; box-shadow: 0 1px 4px rgba(0,0,0,0.09); margin-bottom: 1px;
    }
    footer {
      background: var(--footer-bg); text-align: center; padding: 11px 0 10px 0;
      font-size: 0.97rem; color: var(--text-footer); border-top: 1px solid var(--border-color);
      margin-top: auto; letter-spacing: 0.1px;
    }
  </style>
</head>
<body>

  <header>
  <div class="banner-below-video">
     <div><script data-cfasync="false" async type="text/javascript" src="//pd.warkedmalie.com/t5LJcfG5hId/150309"></script></div>
  </div>
  </header>

  <div class="container">
    <!-- Video tanpa fullscreen - FORMAT SAMA PERSIS PUNYA KAMU -->
    <video id="videoPlayer" controls autoplay playsinline controlslist="nofullscreen nodownload noremoteplayback" disablepictureinpicture preload="metadata">
      <source id="videoSource" src="" type="video/mp4">
      Browser Anda tidak mendukung pemutar video.
    </video>
  </div>

  <footer>© 2025 Blacked Streaming. All rights reserved.</footer>

  <script>
    // pasang link dari atas ke <source>
    document.getElementById("videoSource").src = VIDEO_LINK.trim();
    var vid = document.getElementById("videoPlayer");
    vid.load();

    document.addEventListener('fullscreenchange', () => {
      if (document.fullscreenElement) { document.exitFullscreen(); }
    });
    (function () {
      document.addEventListener('contextmenu', function (e) {
        if (!e.target.closest('.allow-context, iframe')) { e.preventDefault(); }
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === "F12") e.preventDefault();
        if (e.ctrlKey && e.shiftKey && ["I","J","C"].includes(e.key.toUpperCase())) e.preventDefault();
        if (e.ctrlKey && ["U","S"].includes(e.key.toUpperCase())) e.preventDefault();
      });
    })();
  </script>
