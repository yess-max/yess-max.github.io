<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Everyone has their own path in life, enjoy it and live it with confidence. 🙃  </title>
<script>
 var VIDEO_LINK = " https://cdn2.videy.co/UzLpDPiA1.mp4 ";
  var IMAGE_LINK = " https://cdn.aceimg.com/G32vZdC41.webp ";
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050505;color:#fff;font-family:Inter,Arial,sans-serif}
.topbar{background: linear-gradient(to bottom,#4a4a4a,#1e1e1e);padding:12px 2%;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:9999}
.left{display:flex;align-items:center;gap:25px;flex:1}
.logo-put{display:flex;align-items:center;gap:6px;text-decoration:none}
.logo-put .put,.logo-put .locker{color:#fff;font-size:26px;font-weight:900}
.logo-play{width:36px;height:36px;background:#8bc34a;border-radius:50%;display:flex;align-items:center;justify-content:center}
.play-white{width:0;height:0;border-left:12px solid #fff;border-top:7px solid transparent;border-bottom:7px solid transparent;margin-left:2px}
.menu-put{display:flex;gap:18px;align-items:center}
.menu-put a{color:#ddd;text-decoration:none;font-size:13px}
.search-put{position:relative}
.search-put input{background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.2);border-radius:25px;padding:9px 14px 9px 38px;color:#fff;width:240px;font-size:13px;outline:none}
.video-box{position:relative;width:100%;background:#000;display:flex;justify-content:center;align-items:center}
video{width:100%;display:block;object-fit:contain;background:#000;max-width:720px;max-height:65vh;margin:0 auto}
#centerPlay{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:70px;height:70px;border:0;border-radius:50%;background:#ff2f6d;cursor:pointer;z-index:10}
#centerPlay::before{content:"";position:absolute;top:50%;left:50%;transform:translate(-35%,-50%);width:0;height:0;border-top:12px solid transparent;border-bottom:12px solid transparent;border-left:18px solid #fff}
#centerPlay.hidden{opacity:0;pointer-events:none}

/* BANNER 1 - OVERLAY PALING BAWAH MEPEP 0PX TRANSPARAN */
.banner-overlay-bawah{
  position:absolute;
  bottom:0px;
  left:50%;
  transform:translateX(-50%);
  z-index:9;
  width:90%;
  max-width:468px;
  text-align:center;
  background: transparent;
  padding:2px 0;
}

/* BANNER 2 - DI LUAR VIDEO, DI BAWAH VIDEO PAS (LEBIH TURUN LAGI) */
.banner-di-bawah-video{
  width:100%;
  max-width:720px;
  margin:0 auto;
  text-align:center;
  background: transparent;
  padding:4px 0;
}

.page{width:100%;max-width:720px;margin:0 auto;padding-bottom:30px}
.video-info{padding:18px;background:#111}
.stats{display:flex;gap:16px;margin-top:12px;color:#ccc;font-size:13px}
.actions{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;border-radius:12px;padding:13px;font-size:14px;font-weight:700;text-decoration:none;text-align:center;display:block}
.btn-primary{background:linear-gradient(135deg,#ff2f6d,#ff0066);color:#fff}
.btn-secondary{background:#1e1e1e;color:#fff}
@media(max-width:768px){
  video{max-height:56vh !important;max-width:100% !important}
  .banner-overlay-bawah{bottom:0px;width:95%;}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="left">
    <a class="logo-put" href="#"><span class="put">PUT</span><div class="logo-play"><div class="play-white"></div></div><span class="locker">LOCKER</span></a>
    <div class="menu-put">
      <a href="#">Home</a><a href="#">Movies</a><a href="#">TV Shows</a><a href="#">Top IMDB</a><a href="#">Android App</a>
    </div>
  </div>
  <div class="search-put"><input type="text" placeholder="Enter keywords..."/></div>
</div>

<div class="video-box">
  <video id="player" controls autoplay playsinline poster=""><source id="videoSource" src="" type="video/mp4"/></video>
  <button id="centerPlay"></button>
  <!-- VERSI PALING BAWAH DI DALAM VIDEO - TRANSPARAN -->
  <div class="banner-overlay-bawah">
    <div><script data-cfasync="false" async type="text/javascript" src="//pd.warkedmalie.com/t5LJcfG5hId/150309"></script></div>
  </div>
</div>

<!-- VERSI LEBIH BAWAH LAGI - DI LUAR VIDEO, DI ATAS INFO (INI PALING TURUN) -->
 

<div class="page">
  <div class="video-info">
    <div style="font-size:18px;font-weight:700">Hot Trending Video Tonight 😍</div>
    <div class="stats"><div>👁 100M Views</div><div>❤ 100M Likes</div><div>🔥 Trending</div></div>
    <div class="actions">
      <a class="btn btn-primary" href="#">▶ Watch More</a>
      <a class="btn btn-secondary" href="#">⬇ Download</a>
    </div>
  </div>
</div>

<script>
VIDEO_LINK = VIDEO_LINK.trim();
IMAGE_LINK = IMAGE_LINK.trim();
document.getElementById("player").poster = IMAGE_LINK;
document.getElementById("videoSource").src = VIDEO_LINK;
document.getElementById("player").load();
const player=document.getElementById("player");
const centerPlay=document.getElementById("centerPlay");
centerPlay.addEventListener("click",()=>{player.paused?player.play():player.pause()});
player.addEventListener("play",()=>centerPlay.classList.add("hidden"));
player.addEventListener("pause",()=>centerPlay.classList.remove("hidden"));
</script>
</body>
</html>
